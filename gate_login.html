<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Вход</title>
  <link rel="icon" type="image/jpeg" href="/sonik.jpg" />
  <link rel="apple-touch-icon" href="/sonik.jpg" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0a0a0a; color: #e8e8e8;
    }
    .card {
      width: 100%; max-width: 22rem; padding: 1.75rem 1.5rem;
      border: 1px solid #2a2a2a; border-radius: 12px; background: #111;
    }
    h1 { margin: 0 0 1.25rem; font-size: 1.25rem; font-weight: 600; color: #fafafa; }
    label { display: block; font-size: 0.75rem; font-weight: 600; color: #a3a3a3; margin-bottom: 0.35rem; }
    input[type="password"], input[type="text"] {
      width: 100%; padding: 0.55rem 0.65rem; margin-bottom: 1rem;
      border-radius: 8px; border: 1px solid #333; background: #0c0c0c; color: #e8e8e8; font-size: 0.9rem;
    }
    .row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1.1rem; }
    .row input { width: auto; margin: 0; }
    .row label { margin: 0; font-size: 0.85rem; color: #d4d4d4; cursor: pointer; }
    button {
      width: 100%; padding: 0.6rem 1rem; border: none; border-radius: 8px;
      background: #0d9488; color: #fff; font-weight: 600; font-size: 0.95rem; cursor: pointer;
    }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    button:hover:not(:disabled) { background: #14b8a6; }
    .err { color: #fca5a5; font-size: 0.8125rem; margin-top: 0.75rem; min-height: 1.2em; }
    .hint { font-size: 0.75rem; color: #737373; margin-top: 1rem; line-height: 1.45; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Вход</h1>
    <label for="pw">Пароль</label>
    <input id="pw" type="password" autocomplete="current-password" />
    <div class="row">
      <input id="rm" type="checkbox" />
      <label for="rm">Запомнить меня</label>
    </div>
    <button type="button" id="go">Войти</button>
    <p class="err" id="err"></p>
  </div>
  <script>
    const pw = document.getElementById("pw");
    const rm = document.getElementById("rm");
    const go = document.getElementById("go");
    const err = document.getElementById("err");
    async function submit() {
      err.textContent = "";
      go.disabled = true;
      try {
        const r = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: pw.value, remember_me: rm.checked }),
        });
        if (!r.ok) {
          err.textContent = "Неверный пароль или недоступно.";
          return;
        }
        window.location.href = "/parsing/";
      } catch {
        err.textContent = "Сеть недоступна.";
      } finally {
        go.disabled = false;
      }
    }
    go.addEventListener("click", submit);
    pw.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
  </script>
</body>
</html>
